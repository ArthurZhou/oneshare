<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneShare - File Sharing</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M22 12H2'/%3E%3Cpath d='M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z'/%3E%3Cline x1='6' y1='16' x2='6.01' y2='16'/%3E%3Cline x1='10' y1='16' x2='10.01' y2='16'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="header">
  <div class="header-left">
    <span class="brand"><i data-feather="hard-drive"></i> OneShare</span>
    <nav id="path-nav" class="path-nav"></nav>
  </div>
  <div class="header-right">
    <div id="user-info" class="user-info">
      <a href="auth/login" class="btn btn-sm">Login</a>
    </div>
  </div>
</header>

<main>
  <div id="toolbar" class="toolbar">
    <div class="toolbar-left">
      <button id="btn-upload" class="btn btn-primary" title="Upload files"><i data-feather="upload"></i> Upload</button>
      <button id="btn-upload-folder" class="btn" title="Upload a folder (preserves structure)"><i data-feather="folder-plus"></i> Folder</button>
      <button id="btn-mkdir" class="btn" title="New folder"><i data-feather="folder"></i> New Folder</button>
    </div>
    <div class="toolbar-right">
      <button id="btn-refresh" class="btn" title="Refresh"><i data-feather="refresh-cw"></i></button>
      <button id="btn-admin" class="btn btn-admin" title="Admin panel" style="display:none"><i data-feather="settings"></i> Admin</button>
    </div>
  </div>

  <div id="file-list" class="file-list">
    <div class="loading">Loading...</div>
  </div>

  <div id="drag-overlay" class="drag-overlay" style="display:none">
    <div class="drag-message">Drop files to upload</div>
  </div>
</main>

<!-- Context Menu -->
<div id="ctx-menu" class="ctx-menu" style="display:none">
  <div class="ctx-item" data-action="download"><i data-feather="download"></i> Download</div>
  <div class="ctx-item" data-action="rename"><i data-feather="edit-2"></i> Rename</div>
  <div class="ctx-item" data-action="move"><i data-feather="corner-up-right"></i> Move</div>
  <div class="ctx-item ctx-danger" data-action="delete"><i data-feather="trash-2"></i> Delete</div>
</div>

<!-- Modal -->
<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div id="modal" class="modal">
    <div class="modal-header">
      <span id="modal-title">Modal</span>
      <button class="modal-close" id="modal-close"><i data-feather="x"></i></button>
    </div>
    <div id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-ok">OK</button>
    </div>
  </div>
</div>

<!-- Transfers: upload/download progress with resume -->
<div id="transfers-panel" class="transfers-panel" style="display:none">
  <div class="transfers-header">
    <span><i data-feather="activity"></i> Transfers</span>
    <button id="transfers-clear" class="btn btn-sm" title="Clear finished tasks"><i data-feather="x"></i></button>
  </div>
  <div id="tuning-bar" class="tuning-bar" style="display:none">
    <span id="tuning-phase" class="tuning-phase">—</span>
    <span class="tuning-chip"><b>conc</b><i id="tuning-conc">—</i></span>
    <span class="tuning-chip"><b>up win</b><i id="tuning-uw">—</i></span>
    <span class="tuning-chip"><b>dl win</b><i id="tuning-dw">—</i></span>
    <span class="tuning-chip"><b>chunk</b><i id="tuning-chunk">—</i></span>
    <span class="tuning-chip"><b>rtt</b><i id="tuning-rtt">—</i></span>
    <span class="tuning-chip"><b>mbps</b><i id="tuning-mbps">—</i></span>
  </div>
  <div id="transfers-list" class="transfers-list"></div>
</div>

<!-- Admin feedback toasts (appended by admin.js) -->
<div id="toast-container" class="toast-container"></div>

<!-- Admin Panel -->
<div id="admin-panel" class="admin-panel" style="display:none">
  <div class="admin-header">
    <h3><i data-feather="settings"></i> Administration</h3>
    <button class="modal-close" id="admin-close"><i data-feather="x"></i></button>
  </div>
  <div class="admin-tabs">
    <button class="admin-tab active" data-tab="acl">ACL</button>
    <button class="admin-tab" data-tab="groups">Groups</button>
    <button class="admin-tab" data-tab="users">Users</button>
  </div>
  <div id="admin-content"></div>
</div>

<input type="file" id="file-input" multiple style="display:none">
<input type="file" id="folder-input" webkitdirectory style="display:none">

<!-- Asset paths are relative so the frontend works at the domain root or under
     any URL prefix (e.g. /oneshare) without server-side HTML templating.
     config.js is served dynamically by the backend and sets window.ONESHARE_BASE
     so the client can build absolute API/file URLs under the prefix. -->
<script src="config.js"></script>
<script src="js/api.js"></script>
<!-- icons.js: lightweight inline-SVG icons (Feather subset) + initIcons() -->
<script src="js/icons.js"></script>
<!-- libfw-client SDK (UMD) + its wrapper: all file transfers go through here -->
<script src="vendor/libfw-client.js"></script>
<script src="js/libfw.js"></script>
<script src="js/auth.js"></script>
<script src="js/file-explorer.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
