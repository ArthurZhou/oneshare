[package]
name = "oneshare"
version = "0.1.2"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie", "cookie-private", "cookie-signed"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["make"] }
tower-http = { version = "0.5", features = ["cors", "fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
openidconnect = "3"
url = "2"
percent-encoding = "2"
sha2 = "0.10"
base64 = "0.22"
hmac = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mime_guess = "2"
libfw-core = "0.1"
libfw-server = "0.1"
# reqwest uses rustls for TLS. We supply the crypto provider ourselves: use
# `rustls-no-provider` + a direct `rustls` dep on `ring` instead of the default
# `aws-lc-rs`, so the build needs only a C compiler + perl (no cmake).
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
