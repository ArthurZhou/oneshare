# OneShare Configuration Example
# Copy this file to config.toml and fill in your values.

[server]
listen_addr = "0.0.0.0"
listen_port = 3456
root_dir = "./data"
database_url = "oneshare.db"
# IMPORTANT: set a strong random value (>= 16 bytes). The server refuses to
# start with the default/empty secret.
hmac_secret = "REPLACE_WITH_A_STRONG_RANDOM_SECRET_AT_LEAST_16_BYTES"
# URL prefix (base path) when running behind a reverse proxy on a shared
# domain, e.g. "/oneshare". Leave empty to serve at the domain root.
base_url = ""
# Mark the session cookie Secure (HTTPS-only). Enable when serving over TLS.
session_cookie_secure = false
# Optional CORS allowlist of origins (empty = same-origin only).
allowed_origins = []
# Trash directory for deletions. When set, deleted files/folders are MOVED
# here (preserving their relative path) instead of being deleted permanently,
# so they can be recovered. Relative paths resolve against root_dir (".trash"
# is a good choice — dot-prefixed entries are hidden from listings). Empty
# (default) = delete permanently.
trash_dir = ".trash"

[oidc]
issuer_url = "https://login.example.com"
client_id = "your-client-id"
client_secret = "your-client-secret"
redirect_uri = "http://localhost:3456/auth/callback"
# Optional overrides for any of the OIDC endpoints (authorization_endpoint,
# token_endpoint, userinfo_endpoint, jwks_uri). When ALL of them are set,
# well-known discovery is skipped entirely. jwks_uri is REQUIRED for ID token
# verification if the issuer does not support discovery: the server now
# verifies the ID token signature (RS256 via the JWKS) plus iss/aud/exp/nonce
# on every login, and refuses to start when it cannot obtain a JWKS.
# authorization_endpoint = "https://login.example.com/authorize"
# token_endpoint = "https://login.example.com/token"
# userinfo_endpoint = "https://login.example.com/userinfo"
# jwks_uri = "https://login.example.com/jwks"

# libfw file-transfer layer. Server knobs configure the embedded libfw router;
# client knobs are served to the browser via /config.js (window.ONESHARE_LIBFW)
# so the frontend configures the libfw-client SDK from this file.
[libfw]
# REQUIRED: 64-hex (32-byte) AES-256 key for libfw's EncryptedPathCodec.
# Real storage paths are encrypted into opaque `v1.<base64url>` shadow paths
# before anything reaches the browser — bearer tokens, `/file`/`/dir` URLs,
# directory listings, upload echoes — so no real filesystem path ever leaves
# the server. Generate with: openssl rand -hex 32
# Keep it stable across restarts; rotating it invalidates outstanding tokens
# (they expire within the 1h TTL anyway). The server refuses to start
# without it.
path_key = "<openssl rand -hex 32>"
# Download compression served by the embedded server: "none" (default, safe
# for plain browser fetches) or "zrip" (the SDK can decompress it). The SDK's
# compress flag mirrors this.
compression = "none"
# Upper bound for a single upload body in bytes (default 100 GiB).
max_upload_size = 107374182400
# Client SDK options (defaults shown).
concurrency = 4
# One knob controls EVERY chunk size: this single value is used for upload
# chunks AND download byte ranges (downloadChunkSize is set to this in the
# frontend, instead of the SDK's default 256 KiB download chunks).
chunk_size = 2097152
# Per-file scheduling window: parallel chunks in flight for one file.
# Total in-flight upload requests ≈ concurrency × upload_window. Defaults to
# 4 (same as concurrency) so uploads stay bounded; raise only if you want
# deeper per-file pipelining.
upload_window = 4
# Same knob on the download side: parallel byte ranges fetched per file.
# Defaults to 4 (the SDK's own downloadWindow default); without this the
# frontend would silently use the SDK default instead of a configured value.
download_window = 4
max_retries = 3
base_retry_delay_ms = 500
max_retry_delay_ms = 30000
# Per-read (idle) timeout in ms. The libfw engine aborts the whole
# transfer if ANY single read stalls longer than this — it is not a
# total-transfer deadline. Keep it generous (default 600000 = 10 min) so a
# slow link / large upload / high-latency reconciliation never kills a
# healthy transfer; 0 disables the JS timer (browser network errors still
# detect a dead peer).
timeout_ms = 600000
# Adaptive tuning (libfw-client >= 0.3.3): when true, the browser probes the
# server's public /capabilities advertisement and TCP-style ramps
# concurrency / windows / chunk sizes (and the zrip level) from real
# transfer stats, persisting a settled result per origin for tune_ttl_ms.
# The static knobs above act as starting/minimum values. Default false —
# transfers then behave exactly as configured.
auto_tune = false
# How long a settled tuning result is reused before re-ramping (ms).
# Only meaningful with auto_tune = true. Default 3600000 (1 h).
tune_ttl_ms = 3600000
