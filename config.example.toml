# OneShare Configuration Example
# Copy this file to config.toml and replace the placeholder values.
# This file is the canonical reference for the runtime settings used by OneShare.

[server]
# Public bind address for the HTTP server.
listen_addr = "0.0.0.0"
# Listening port.
listen_port = 3456
# Root directory used for file storage and uploaded content.
root_dir = "./data"
# SQLite database path.
database_url = "oneshare.db"
# IMPORTANT: set a strong random value (>= 16 bytes). The server refuses to
# start with an empty or weak secret.
hmac_secret = "REPLACE_WITH_A_STRONG_RANDOM_SECRET_AT_LEAST_16_BYTES"
# Optional URL prefix when OneShare is served behind a reverse proxy under a
# subpath, e.g. "/oneshare". Leave empty to serve at the domain root.
base_url = ""
# Mark the session cookie Secure (HTTPS-only). Enable only when serving over TLS.
session_cookie_secure = false
# Optional CORS allowlist. Empty means same-origin only.
allowed_origins = []
# When set, deleted files/folders are moved here instead of being permanently
# removed. Relative paths resolve against root_dir.
trash_dir = ".trash"
# Audit log retention in days. 0 keeps entries forever.
audit_retention_days = 365
# Optional admin username. When set, this user is treated as admin based on
# the config on every request. Leave unset to keep the legacy first-login-admin
# behavior.
# admin_user = "your-username"

[oidc]
issuer_url = "https://login.example.com"
client_id = "your-client-id"
client_secret = "your-client-secret"
# There is no redirect_uri setting here. The callback URL is derived from the
# request scheme + host + base_url, so register that exact URL in the OIDC
# provider.
# Optional endpoint overrides. If all of them are set, discovery is skipped.
# authorization_endpoint = "https://login.example.com/authorize"
# token_endpoint = "https://login.example.com/token"
# userinfo_endpoint = "https://login.example.com/userinfo"
# jwks_uri = "https://login.example.com/jwks"

[libfw]
# REQUIRED: 64-hex (32-byte) AES-256 key for libfw's EncryptedPathCodec.
# Generate with: openssl rand -hex 32
# Keep it stable across restarts; rotating it invalidates outstanding tokens.
path_key = "<openssl rand -hex 32>"
# Server-side compression used by the embedded libfw router.
# "none" is the safe default for plain browser downloads.
# "zrip" is allowed when the client can decode it.
compression = "none"
# Upper bound for a single upload request body in bytes.
max_upload_size = 107374182400
# Browser-side libfw-client tuning values. These are served by /config.js so the
# frontend uses the same values as the backend.
concurrency = 4
# Upload chunk size and the download byte-range chunk size.
# This single knob controls both upload chunks and download byte ranges.
chunk_size = 2097152
# Number of chunks for one file allowed in flight concurrently.
upload_window = 4
# Number of parallel byte ranges for one file on the download side.
download_window = 4
# Retry policy for transfer chunks/files.
max_retries = 3
base_retry_delay_ms = 500
max_retry_delay_ms = 30000
# Per-read idle timeout in milliseconds. Keep it generous, because this is a
# read-level timeout, not a total-transfer deadline.
timeout_ms = 600000
# When enabled, libfw-client may auto-tune from real transfer stats and persist
# the result for tune_ttl_ms. The static values above remain the starting point.
auto_tune = false
# Cache lifetime for settled auto-tuning results, in milliseconds.
tune_ttl_ms = 3600000
