name: Build and Upload Release Assets

on:
  release:
    types: [published]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The OneShare frontend is plain static HTML/CSS/JS (no package.json /
      # Node build step), so there is nothing to compile here — the files under
      # ./frontend are bundled directly into the release asset below, next to
      # the binary (the server serves them via ServeDir::new("./frontend")).

      - name: Set up Rust (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install build dependencies (musl + aws-lc/ring toolchain)
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake perl

      - name: Run Backend Build Script
        run: |
          export CC=musl-gcc
          chmod +x ./build.sh
          ./build.sh

      - name: Prepare Release Asset
        run: |
          set -euxo pipefail
          BIN="target/x86_64-unknown-linux-musl/release/oneshare"
          VERSION="${{ github.event.release.tag_name }}"
          ASSET="oneshare-${VERSION//\//-}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p dist/oneshare
          strip "$BIN" || true
          cp "$BIN" dist/oneshare/oneshare
          cp -r frontend dist/oneshare/frontend
          cp config.example.toml dist/oneshare/config.example.toml
          cp README.md dist/oneshare/README.md
          tar -C dist -czf "$ASSET" oneshare
          echo "ASSET_NAME=$ASSET" >> "$GITHUB_ENV"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_NAME }}
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
