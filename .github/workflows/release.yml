name: Build and Upload Release Assets

on:
  release:
    types: [published]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The frontend is minified by Vite (pnpm build) and embedded into the
      # binary at compile time (include_str! in src/statics.rs, release profile
      # only). There is no loose webpage to ship anymore, so the release asset
      # is the single stripped binary (no tar.gz).

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Match local: pnpm 11 reads allowBuilds from frontend/pnpm-workspace.yaml
          # (needed so esbuild's postinstall runs in CI).
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend (Vite -> ../static)
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Set up Rust (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install build dependencies (musl + ring toolchain)
        run: sudo apt-get update && sudo apt-get install -y musl-tools perl

      - name: Build backend (musl release)
        env:
          # ring (TLS) and the final link need a C toolchain targeting musl.
          CC: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Prepare Release Asset
        run: |
          set -euxo pipefail
          BIN="target/x86_64-unknown-linux-musl/release/oneshare"
          VERSION="${{ github.event.release.tag_name }}"
          ASSET="oneshare-${VERSION//\//-}-x86_64-unknown-linux-musl"
          strip "$BIN" || true
          cp "$BIN" "$ASSET"
          echo "ASSET_NAME=$ASSET" >> "$GITHUB_ENV"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_NAME }}
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
